name: Android verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Test and build
        run: >
          ./gradlew
          :biometricslib:testDebugUnitTest :biometricslib:lintDebug :biometricslib:ktlintCheck
          :app:testDebugUnitTest :app:lintDebug :app:ktlintCheck :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish release to the verification repository
        run: ./gradlew :biometricslib:publishReleasePublicationToVerificationRepository
      - name: Build an external consumer
        run: ./gradlew -p consumer-smoke assembleDebug

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This PIN belongs only to the disposable CI emulator.
      CREDENTIAL_TEST_PIN: '2468'
      INSTRUMENTATION_CLASSES: >-
        io.delightlabs.biometrics.BiometricsDemoTest,io.delightlabs.biometrics.AuthenticationRequestApiTest,io.delightlabs.biometrics.AuthenticationPromptIntegrationTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API 30 instrumentation and credential prompts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell wm dismiss-keyguard
            adb shell locksettings set-pin "$CREDENTIAL_TEST_PIN"
            ./gradlew :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$INSTRUMENTATION_CLASSES" -Pandroid.testInstrumentationRunnerArguments.runCredentialPromptTests=true "-Pandroid.testInstrumentationRunnerArguments.credentialPromptTestPin=$CREDENTIAL_TEST_PIN"
      - name: Require every selected test class to execute without skips
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = set(os.environ["INSTRUMENTATION_CLASSES"].split(","))
          results = {name: [] for name in expected}
          reports = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No instrumentation JUnit reports were produced")
          for report in reports:
              for case in ET.parse(report).iter("testcase"):
                  if case.get("classname") in results:
                      results[case.get("classname")].append(case)
          for name, cases in sorted(results.items()):
              if not cases:
                  raise SystemExit(f"No tests executed for {name}")
              for case in cases:
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                      raise SystemExit(f"Test did not pass: {name}.{case.get('name')}")
              print(f"{name}: {len(cases)} tests passed")
          PY
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api30-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7
